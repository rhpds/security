# OpenShift grants project creation via ClusterRoleBinding self-provisioners
# (plural). false: empty the subjects and set autoupdate=false so the cluster
# policy controller does not restore the groups. GitOps self-heal keeps it.
# true: put both groups on the binding. The binding stays in this chart
# either way, so changing the value and syncing is what flips a live cluster.
selfProvisioner:
  enabled: false

# image.config.openshift.io/cluster spec.registrySources.allowedRegistries.
# Anything not listed is blocked. Do not set blockedRegistries.
# registry.redhat.io, registry.access.redhat.com, quay.io, and the internal
# registry hostname are required or platform and lab pods fail to pull.
# docker.io is for lab images.
# An empty list does not render the object.
# Applying this restarts CRI-O on the nodes. The Machine Config Operator
# cordons each node while it does that.
allowedRegistries:
  - quay.io
  - registry.redhat.io
  - registry.access.redhat.com
  - image-registry.openshift-image-registry.svc:5000
  - docker.io
  - registry-1.docker.io
