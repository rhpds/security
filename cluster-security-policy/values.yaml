# Cluster AdminNetworkPolicy.
# subjectLabel: the namespace label whose presence selects which namespaces
# this ANP applies to. Must be a label, not an annotation.
# An empty subject also selects openshift-*, which the product docs warn against.
adminNetworkPolicy:
  name: tenant-egress
  priority: 50
  subjectLabel: demo.redhat.com/tenant-uuid

# CIDRs allowed out of user namespaces, inserted before the deny of 0.0.0.0/0 and ::/0.
# Empty renders DNS, the API, ingress, then deny.
# AdminNetworkPolicy takes CIDRs, not hostnames. A lab that must reach an
# address outside the cluster, including an external registry, puts those
# CIDRs here. This is cluster-wide. The per-tenant policy does not carry it.
extraEgressCIDRs: []

# Platform namespaces user workloads may open connections to.
# Checked before the deny. The internal registry is included so image
# pull and push work. Add openshift-logging or the monitoring namespace
# here when a lab needs the pods to call those services.
# This is not a CIDR list. extraEgressCIDRs is only for addresses outside the cluster.
allowNamespaces:
  - openshift-image-registry

# OpenShift grants project creation via ClusterRoleBinding self-provisioners
# (plural). false: empty the subjects and set autoupdate=false so the cluster
# policy controller does not restore the groups. GitOps self-heal keeps it.
# true: put both groups on the binding. The binding stays in this chart
# either way, so changing the value and syncing is what flips a live cluster.
selfProvisioner:
  enabled: false

# image.config.openshift.io/cluster spec.registrySources.allowedRegistries.
# Anything not listed is blocked. Do not set blockedRegistries.
# registry.redhat.io, registry.access.redhat.com, quay.io, and the internal
# registry hostname are required or platform and lab pods fail to pull.
# docker.io is for lab images.
# An empty list does not render the object.
# Applying this restarts CRI-O on the nodes. The Machine Config Operator
# cordons each node while it does that.
allowedRegistries:
  - quay.io
  - registry.redhat.io
  - registry.access.redhat.com
  - image-registry.openshift-image-registry.svc:5000
  - docker.io
  - registry-1.docker.io
