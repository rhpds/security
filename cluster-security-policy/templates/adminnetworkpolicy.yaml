apiVersion: policy.networking.k8s.io/v1alpha1
kind: AdminNetworkPolicy
metadata:
  name: {{ .Values.adminNetworkPolicy.name }}
spec:
  priority: {{ .Values.adminNetworkPolicy.priority }}
  subject:
    namespaces:
      matchExpressions:
        - key: {{ .Values.adminNetworkPolicy.subjectLabel }}
          operator: Exists
  ingress:
    - name: allow-from-ingress
      action: Allow
      from:
        - namespaces:
            matchLabels:
              policy-group.network.openshift.io/ingress: ""
  egress:
    - name: allow-dns
      action: Allow
      to:
        - namespaces:
            matchLabels:
              kubernetes.io/metadata.name: openshift-dns
      ports:
        - portNumber:
            protocol: UDP
            port: 53
        - portNumber:
            protocol: TCP
            port: 53
        - portNumber:
            protocol: UDP
            port: 5353
        - portNumber:
            protocol: TCP
            port: 5353
    - name: allow-api
      action: Allow
      to:
        - nodes:
            matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: Exists
      ports:
        - portNumber:
            protocol: TCP
            port: 6443
    - name: allow-ingress-routes
      action: Allow
      to:
        - nodes:
            matchExpressions:
              - key: kubernetes.io/os
                operator: Exists
      ports:
        - portNumber:
            protocol: TCP
            port: 443
    - name: allow-image-registry
      action: Allow
      to:
        - namespaces:
            matchLabels:
              kubernetes.io/metadata.name: openshift-image-registry
      ports:
        - portNumber:
            protocol: TCP
            port: 5000
    - name: allow-kubernetes-api-svc
      action: Allow
      to:
        - namespaces:
            matchLabels:
              kubernetes.io/metadata.name: default
      ports:
        - portNumber:
            protocol: TCP
            port: 443
    {{- range .Values.allowNamespaces }}
    - name: allow-to-{{ . }}
      action: Allow
      to:
        - namespaces:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
    {{- end }}
    {{- if .Values.extraEgressCIDRs }}
    - name: allow-extra-cidrs
      action: Allow
      to:
        - networks:
            {{- range .Values.extraEgressCIDRs }}
            - {{ . | quote }}
            {{- end }}
    {{- end }}
    - name: deny-outside
      action: Deny
      to:
        - networks:
            - 0.0.0.0/0
            - "::/0"
