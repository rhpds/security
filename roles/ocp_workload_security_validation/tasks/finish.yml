---
- name: Publish the security report
  agnosticd.core.agnosticd_user_info:
    data: "{{ r_security_validation.user_data }}"

- name: Fail the provision when a security check failed
  vars:
    _failed: "{{ r_security_validation.findings | selectattr('ok', 'equalto', false) | list }}"
  when: _failed | length > 0
  ansible.builtin.fail:
    msg: >-
      {{ _failed | length }} security check(s) failed.
      The seat will not be released:
      {{ _failed | map(attribute='check') | join(', ') }}.
