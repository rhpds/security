---
- name: Record whether the cluster security Application is Healthy and Synced
  ansible.builtin.set_fact:
    _security_findings: "{{ _security_findings + [_application_finding] }}"
  vars:
    _application_ok: >-
      {{
        _cluster_security_application_health == 'Healthy'
        and _cluster_security_application_sync == 'Synced'
      }}
    _application_finding:
      check: >-
        Application {{ ocp_workload_cluster_security_policy_application_name }}
      ok: "{{ _application_ok | bool }}"
      detail: >-
        health {{ _cluster_security_application_health | default('missing') }},
        sync {{ _cluster_security_application_sync | default('missing') }}

- name: Read the cluster AdminNetworkPolicy named by the Application
  kubernetes.core.k8s_info:
    host: "{{ _security_api_url | default(omit) }}"
    api_key: "{{ _security_api_key | default(omit) }}"
    validate_certs: "{{ _security_validate_certs | default(omit) }}"
    api_version: policy.networking.k8s.io/v1alpha1
    kind: AdminNetworkPolicy
    name: "{{ (_cluster_security_desired.adminNetworkPolicy | default({})).name | default('tenant-egress') }}"
  register: _cluster_security_validation_anp

- name: Record the cluster AdminNetworkPolicy result
  ansible.builtin.set_fact:
    _security_findings: "{{ _security_findings + [_anp_finding] }}"
    _cluster_security_live_anp_priority: "{{ _anp_priority }}"
  vars:
    _anp: "{{ _cluster_security_validation_anp.resources | default([], true) | first | default({}, true) }}"
    _anp_missing: "{{ _anp | length == 0 }}"
    _egress: "{{ _anp | json_query('spec.egress') | default([], true) }}"
    _egress_names: "{{ _egress | map(attribute='name') | list }}"
    _ingress_names: "{{ _anp | json_query('spec.ingress') | default([], true) | map(attribute='name') | list }}"
    _deny_action: "{{ _egress | selectattr('name', 'equalto', 'deny-outside') | map(attribute='action') | list }}"
    _want_allows: >-
      {{
        _cluster_security_desired.allowNamespaces | default([], true)
        | map('regex_replace', '^', 'allow-to-')
        | list
      }}
    _requester: >-
      {{
        _anp | json_query('spec.subject.namespaces.matchExpressions') | default([], true)
        | selectattr('key', 'equalto', 'openshift.io/requester')
        | selectattr('operator', 'equalto', 'Exists')
        | list
      }}
    _anp_priority: "{{ -1 if (_anp | json_query('spec.priority')) is none else (_anp | json_query('spec.priority')) }}"
    _want_priority: "{{ (_cluster_security_desired.adminNetworkPolicy | default({})).priority | default(none) }}"
    _anp_name: "{{ (_cluster_security_desired.adminNetworkPolicy | default({})).name | default('tenant-egress') }}"
    _anp_ok: >-
      {{
        not (_anp_missing | bool)
        and (_want_priority is none or (_anp_priority | int) == (_want_priority | int))
        and (_requester | length == 1)
        and ('allow-from-ingress' in _ingress_names)
        and ('allow-dns' in _egress_names)
        and ('allow-api' in _egress_names)
        and (_want_allows | difference(_egress_names) | length == 0)
        and (_deny_action == ['Deny'])
        and (
          (_cluster_security_desired.extraEgressCIDRs | default([], true) | length == 0)
          or ('allow-extra-cidrs' in _egress_names)
        )
      }}
    _anp_finding:
      check: "AdminNetworkPolicy {{ _anp_name }}"
      ok: "{{ _anp_ok | bool }}"
      detail: >-
        {{
          'missing'
          if (_anp_missing | bool)
          else 'priority ' ~ _anp_priority
            ~ ('' if _want_priority is none else ', expected ' ~ _want_priority)
        }}

- name: Read image configuration
  kubernetes.core.k8s_info:
    host: "{{ _security_api_url | default(omit) }}"
    api_key: "{{ _security_api_key | default(omit) }}"
    validate_certs: "{{ _security_validate_certs | default(omit) }}"
    api_version: config.openshift.io/v1
    kind: Image
    name: cluster
  register: _cluster_security_validation_image

- name: Record the allowed registries result
  ansible.builtin.set_fact:
    _security_findings: "{{ _security_findings + [_registries_finding] }}"
  vars:
    _image: "{{ _cluster_security_validation_image.resources | default([], true) | first | default({}, true) }}"
    _image_missing: "{{ _image | length == 0 }}"
    _sources: "{{ _image | json_query('spec.registrySources') | default({}, true) }}"
    _live: "{{ _sources.allowedRegistries | default([], true) | map('string') | list }}"
    _registries_set: "{{ _cluster_security_desired.allowedRegistries is defined }}"
    _want: "{{ _cluster_security_desired.allowedRegistries | default([]) | map('string') | list }}"
    _blocked: "{{ _sources.blockedRegistries | default([], true) }}"
    _registries_ok: >-
      {{
        not (_image_missing | bool)
        and (_blocked | length == 0)
        and (
          not (_registries_set | bool)
          or (
            (_want | difference(_live) | length == 0)
            and (_live | difference(_want) | length == 0)
          )
        )
      }}
    _registries_finding:
      check: allowed registries
      ok: "{{ _registries_ok | bool }}"
      detail: >-
        {{
          'image.config.openshift.io/cluster is missing'
          if (_image_missing | bool)
          else 'live ' ~ (_live | join(', '))
        }}

- name: Read the self-provisioner ClusterRoleBinding
  kubernetes.core.k8s_info:
    host: "{{ _security_api_url | default(omit) }}"
    api_key: "{{ _security_api_key | default(omit) }}"
    validate_certs: "{{ _security_validate_certs | default(omit) }}"
    api_version: rbac.authorization.k8s.io/v1
    kind: ClusterRoleBinding
    name: self-provisioner
  register: _cluster_security_validation_self_provisioner

- name: Record the self-provisioner result
  ansible.builtin.set_fact:
    _security_findings: "{{ _security_findings + [_self_provisioner_finding] }}"
  vars:
    _binding: "{{ _cluster_security_validation_self_provisioner.resources | default([], true) | first | default({}, true) }}"
    _binding_missing: "{{ _binding | length == 0 }}"
    _groups: "{{ _binding | json_query('subjects[].name') | default([], true) }}"
    _autoupdate: >-
      {{
        _binding | json_query('metadata.annotations."rbac.authorization.kubernetes.io/autoupdate"')
        | default('', true)
      }}
    _enabled: "{{ (_cluster_security_desired.selfProvisioner | default({})).enabled | default(false) | bool }}"
    _self_provisioner_ok: >-
      {{
        not (_binding_missing | bool)
        and (_autoupdate == 'false')
        and (
          (
            (_enabled | bool)
            and ('system:authenticated' in _groups)
            and ('system:authenticated:oauth' in _groups)
          )
          or (
            not (_enabled | bool)
            and ('system:authenticated' not in _groups)
            and ('system:authenticated:oauth' not in _groups)
          )
        )
      }}
    _self_provisioner_finding:
      check: ClusterRoleBinding self-provisioner
      ok: "{{ _self_provisioner_ok | bool }}"
      detail: >-
        {{
          'missing'
          if (_binding_missing | bool)
          else 'selfProvisioner.enabled '
            ~ (_enabled | bool | lower)
            ~ ', autoupdate ' ~ (_autoupdate | default('missing'))
        }}
