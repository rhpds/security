---
- name: Set up tenant validation context
  when: ocp_workload_security_validation_mode == 'tenant'
  ansible.builtin.include_tasks: setup_tenant.yml

- name: Require the cluster API
  when:
  - ocp_workload_security_validation_mode != 'tenant'
  - ocp_workload_security_validation_api_url | length == 0
    or ocp_workload_security_validation_api_key | length == 0
  ansible.builtin.fail:
    msg: >-
      Cluster security validation needs an API URL and a cluster-admin token.
      None of sandbox_openshift_api_url / openshift_api_url resolved for the
      URL, or none of cluster_admin_agnosticd_sa_token /
      openshift_cluster_admin_token / openshift_api_key resolved for the token.
      Set ocp_workload_security_validation_api_url and
      ocp_workload_security_validation_api_key, or define one of those names in
      the catalog item.

- name: Run security validation
  rhpds.security.validate_tenant_security:
    api_url: "{{ _security_api_url | default(ocp_workload_security_validation_api_url) }}"
    api_key: "{{ _security_api_key | default(ocp_workload_security_validation_api_key | trim) }}"
    validate_certs: "{{ _security_validate_certs | default(false) }}"
    mode: "{{ ocp_workload_security_validation_mode }}"
    application_name: "{{ ocp_workload_cluster_security_policy_application_name }}"
    application_namespace: "{{ ocp_workload_cluster_security_policy_namespace }}"
    tenant_user: "{{ _tenant_security_user | default('') }}"
    tenant_uuid: "{{ _tenant_security_uuid | default('') }}"
    tenant_role: "{{ _tenant_security_role | default('admin') }}"
    namespace_specs: "{{ _tenant_security_namespace_specs | default([]) }}"
    expected_quota: "{{ _tenant_security_expected_quota | default({}) }}"
    quota_is_complete: "{{ _tenant_security_quota_is_complete | default(false) }}"
    use_cluster_quota: "{{ ocp4_workload_tenant_namespace_use_cluster_quota | default(true) }}"
    egress_firewall: "{{ ocp4_workload_tenant_namespace_egress_firewall | default(false) }}"
    expected_tenant_domains: "{{ ocp4_workload_tenant_namespace_egress_allow_domains | default([]) }}"
    expected_tenant_cidrs: "{{ ocp4_workload_tenant_namespace_egress_allow_cidrs | default([]) }}"
    expected_namespace_allows: "{{ ocp4_workload_tenant_namespace_egress_allow_namespaces | default([]) }}"
    showroom_namespace: "{{ ocp4_workload_showroom_namespace | default('') }}"
    admin_token: "{{ cluster_admin_agnosticd_sa_token | default('') | trim }}"
  register: r_security_validation

- name: Publish the security report
  ansible.builtin.include_tasks: finish.yml
